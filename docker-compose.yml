services:
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      selenium:
        condition: service_healthy
    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    volumes:
      - ./report:/app/report
      - ./target:/app/target
    command: mvn test -B
